services:
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: daeum_pgvector
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: daeum
      POSTGRES_PASSWORD: daeum
      POSTGRES_DB: daeum_hangeoreum
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U daeum -d daeum_hangeoreum"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - daeum_pgvector_data:/var/lib/postgresql/data

volumes:
  daeum_pgvector_data:
